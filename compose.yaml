services:
  mysql:
    image: mysql:8.4
    container_name: ecommerce-mysql
    environment:
      MYSQL_DATABASE: ecommerce_db
      MYSQL_USER: ecommerce_app
      MYSQL_PASSWORD: "Kiran@123"
      MYSQL_ROOT_PASSWORD: "Kiran@123"
    ports:
      - "3308:3306"

  app:
    image: ecommerce-app:1.0
    container_name: ecommerce-app
    ports:
      - "8084:8083"
    depends_on:
      - mysql
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/ecommerce_db"
      SPRING_DATASOURCE_USERNAME: "ecommerce_app"
      SPRING_DATASOURCE_PASSWORD: "Kiran@123"